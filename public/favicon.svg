<!-- Mochi's mark: the four-pad cat paw from src/icons.tsx on a brand-orange disc. Vector,
     so it stays crisp at 16px, and filled rather than stroked because stroked toes merge
     into the pad at tab size. Colours are the brand and cream-50 tokens; the palette
     forbids pure white. No double hyphens in here: that is an XML parse error, and strict
     parsers reject the whole file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="16" fill="#F79A4E"/>
  <g transform="translate(4 4) scale(0.9166)" fill="#FFFCF8">
    <ellipse cx="4.4" cy="10.1" rx="2.05" ry="2.5" transform="rotate(-28 4.4 10.1)"/>
    <ellipse cx="9" cy="5.9" rx="2.25" ry="2.65" transform="rotate(-10 9 5.9)"/>
    <ellipse cx="15" cy="5.9" rx="2.25" ry="2.65" transform="rotate(10 15 5.9)"/>
    <ellipse cx="19.6" cy="10.1" rx="2.05" ry="2.5" transform="rotate(28 19.6 10.1)"/>
    <path d="M12 12.4c3.5 0 6.2 2.3 6.2 4.9 0 2.6-2.6 4.5-6.2 4.5s-6.2-1.9-6.2-4.5c0-2.6 2.7-4.9 6.2-4.9z"/>
  </g>
</svg>
