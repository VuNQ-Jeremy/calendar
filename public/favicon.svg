<!-- Mochi's mark: the paw glyph from src/icons.tsx on a brand-orange squircle, the same
     artwork as the mobile app icon (mobile/assets/images/icon.png). Vector, so it stays
     crisp at 16px. Colours are the brand and cream-50 tokens; the palette forbids pure
     white. No double hyphens in here: that is an XML parse error, and strict parsers
     reject the whole file. -->
