name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # Two separate npm projects sharing one repo (docs/mobile/README.md) — the mobile
          # lockfile has to be named or its install is never cached.
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The mobile app was typechecked by nothing until 2026-08-07 — see the note in main.yml.
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile

      # Node 24 for the mobile suite only: its `expo-sqlite` stub is backed by `node:sqlite`,
      # which needs --experimental-sqlite on 22. Everything above stays on 22.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The logic suite only (~1s). The packaging check runs `expo export` and takes about a
      # minute, so it lives in main.yml, on the path to what actually ships.
      - name: Test mobile
        run: npm test
        working-directory: mobile
