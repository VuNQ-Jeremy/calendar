name: Main — checks and D1 migrations

# This workflow does NOT deploy. Cloudflare Workers Builds is the deployer: it is connected
# to this repo in the Cloudflare dashboard and builds every push to main itself.
#
# It used to run `npx wrangler deploy` as well, and the two raced. Workers Builds finished
# last on nearly every push and overwrote the Actions artifact with its own — built from a
# depth-1 clone, so the version stamp collapsed to v0.0000. That is why adding `fetch-depth: 0`
# here never fixed anything: the build it fixed was being thrown away. Keep one deployer.
#
# What stays here is everything Workers Builds does not do: typecheck, a build as a gate, and
# the D1 migrations.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the build number is derived from `git rev-list --count HEAD`
      # (scripts/git-version.mjs), and a truncated count now fails the build outright
      # rather than silently stamping v0.0000.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Prints the CI token's account + permission scopes into the log.
      # The migrations step below needs the "Account -> D1 -> Edit" scope.
      - name: Check Cloudflare auth
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Workers Builds only runs the build and deploy commands, so migrations stay here.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mochi-class --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
